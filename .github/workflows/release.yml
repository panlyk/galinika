name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.5)
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: xvfb-run -a mvn -B clean verify
      - name: Prepare JAR
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version").text)')
          mkdir -p release/jar
          cp "target/galinika-$version.jar" release/jar/
          cd release/jar
          sha256sum "galinika-$version.jar" > "galinika-$version.jar.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: release/jar/*
  windows:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: target
      - name: Prepare WiX and test classes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Check the known WiX location; avoid recursively scanning the runner tool cache.
          $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\bin\candle.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$wix) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
            $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\bin\candle.exe' | Select-Object -First 1
          }
          $wix.DirectoryName >> $env:GITHUB_PATH
          mvn -B test-compile
          if ($LASTEXITCODE -ne 0) { throw 'Test compilation failed' }
      - name: Build Windows upgrade installer
        shell: pwsh
        run: ./packaging/Build-WindowsInstaller.ps1
      - name: Verify upgrade from the original EXE installation
        shell: pwsh
        run: ./packaging/Test-WindowsUpgrade.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/windows/*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-diagnostics
          path: |
            target/jpackage
            target/upgrade-test/*.log
  publish:
    needs: [build, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version").text)')
          test "$RELEASE_TAG" = "v$version"
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "Galinika $version" --notes-file RELEASE_NOTES.md
